name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/beta-') || startsWith(github.event.pull_request.head.ref, 'release/v'))
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: "npm"
          cache-dependency-path: bun.lock
      - name: Download candidate release evidence
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-guard.yml/runs?head_sha=${CANDIDATE_SHA}&event=pull_request&status=success&per_page=100")
          run_id=$(jq -er --arg sha "${CANDIDATE_SHA}" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | sort_by(.id) | last | .id' <<<"${runs}")
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")
          artifact_id=$(jq -er --arg name "release-evidence-${CANDIDATE_SHA}" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | sort_by(.id) | last | .id' <<<"${artifacts}")
          mkdir -p "${RUNNER_TEMP}/release-evidence"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${RUNNER_TEMP}/release-evidence.zip"
          unzip -q "${RUNNER_TEMP}/release-evidence.zip" -d "${RUNNER_TEMP}/release-evidence"
      - name: Guard machine-verified release evidence
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_EVIDENCE_PATH: ${{ runner.temp }}/release-evidence/release-evidence.json
        run: bun scripts/guard-release-pr.ts "$RELEASE_EVIDENCE_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - run: bun run check
      - run: bun run pack:check
      - run: bun run pack:smoke
      - name: Publish to npm
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$RELEASE_BRANCH" == release/beta-* ]]; then
            npm publish --tag beta --provenance
          else
            npm publish --tag latest --provenance
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          git tag "$TAG" || true
          git push origin "$TAG"
          if [[ "$RELEASE_BRANCH" == release/beta-* ]]; then
            gh release create "$TAG" --title "$TAG" --prerelease --generate-notes
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
      - name: Notify monorepo (provider_sdk_released dispatch)
        # Publish already happened: a dispatch failure must not fail the
        # release. The monorepo falls back to a manual bump PR in that case.
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: apifuse
          DOPPLER_CONFIG: prd
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "::warning::DOPPLER_TOKEN secret missing; skipping provider_sdk_released dispatch to the monorepo. Open the bump PR manually."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::warning::package.json version is not exact semver ($VERSION); skipping dispatch."
            exit 1
          fi
          if [[ "$RELEASE_BRANCH" == release/beta-* ]]; then
            DIST_TAG="beta"
          else
            DIST_TAG="latest"
          fi
          # Per-key reads (rule "reads are per key", apifuse wave5 R4-02): one GET
          # per secret NAME; the whole config is never downloaded into the job.
          # Byte-for-byte the monorepo's canonical inline reader
          # (apifuse/.github/workflows/gitops-write.yml, provider-sdk-auto-bump.yml)
          # minus its monorepo-only rollback hint. Measured Doppler contract
          # (2026-09-12): an absent NAME is HTTP 200 with null raw/computed, which
          # yields an empty value and trips the non-empty guard below; any non-2xx
          # (404 config/project not found, 400 "does not have access" from a
          # config-scoped service token, 401/403, 5xx) means the STORE is unreadable
          # and fails here naming the config — never "key absent". The one-time
          # preflight also refuses a branch config (root=false inherits every root
          # secret, so a split config would be a silent no-op).
          doppler_get() {
            local response
            response="$(curl -sS --max-time 20 -w $'\n%{http_code}' -H "Authorization: Bearer ${DOPPLER_TOKEN}" -H "Accept: application/json" "$1")" || response=$'\n000'
            DOPPLER_HTTP_CODE="${response##*$'\n'}"
            DOPPLER_HTTP_BODY="${response%$'\n'*}"
          }
          doppler_config_preflight() {
            doppler_get "https://api.doppler.com/v3/configs/config?project=${DOPPLER_PROJECT}&config=${DOPPLER_CONFIG}"
            if [ "${DOPPLER_HTTP_CODE}" != "200" ]; then
              echo "::error::Doppler config ${DOPPLER_PROJECT}/${DOPPLER_CONFIG} is not readable with this token (HTTP ${DOPPLER_HTTP_CODE}); check the DOPPLER_TOKEN service token access." >&2
              return 1
            fi
            if [ "$(printf '%s' "${DOPPLER_HTTP_BODY}" | jq -r '.config.root')" != "true" ]; then
              echo "::error::Doppler config ${DOPPLER_PROJECT}/${DOPPLER_CONFIG} is a branch config (root=false); it inherits every root secret, so the split would be a silent no-op. Use a root config in its own environment." >&2
              return 1
            fi
          }
          read_secret() {
            doppler_get "https://api.doppler.com/v3/configs/config/secret?project=${DOPPLER_PROJECT}&config=${DOPPLER_CONFIG}&name=$1"
            if [ "${DOPPLER_HTTP_CODE}" != "200" ]; then
              echo "::error::Doppler read of $1 from ${DOPPLER_PROJECT}/${DOPPLER_CONFIG} failed (HTTP ${DOPPLER_HTTP_CODE}); an absent key would be HTTP 200 with a null value, so this is an unreadable store, not a missing key." >&2
              return 1
            fi
            printf '%s' "${DOPPLER_HTTP_BODY}" | jq -r '.value.computed // .value.raw // empty'
          }
          doppler_config_preflight
          app_id=$(read_secret APIFUSE__BOUNTY__GITHUB_APP_ID)
          private_key=$(read_secret APIFUSE__BOUNTY__GITHUB_APP_PRIVATE_KEY)
          if [ -z "${app_id}" ] || [ -z "${private_key}" ]; then
            echo "::warning::APIFUSE__BOUNTY__GITHUB_APP_ID and APIFUSE__BOUNTY__GITHUB_APP_PRIVATE_KEY are missing in Doppler ${DOPPLER_PROJECT}/${DOPPLER_CONFIG}; skipping dispatch."
            exit 1
          fi
          # ::add-mask:: is a line-oriented workflow command. Feeding it a
          # multiline value masks only the first line and PRINTS the remaining
          # lines into the public log (this leaked the App private key in runs
          # 33142176223 / 33370599719). Mask every line individually instead.
          while IFS= read -r mask_line; do
            [ -n "${mask_line}" ] && echo "::add-mask::${mask_line}"
          done <<<"${private_key}"
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          claims=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "${app_id}" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          key_file=$(mktemp)
          printf '%s' "${private_key}" > "${key_file}"
          signature=$(printf '%s.%s' "${header}" "${claims}" | openssl dgst -sha256 -sign "${key_file}" -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          rm -f "${key_file}"
          jwt="${header}.${claims}.${signature}"
          installation_id=$(curl -fsS -H "Authorization: Bearer ${jwt}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/APIFuseHQ/apifuse/installation" | jq -er '.id')
          app_token=$(curl -fsS -X POST -H "Authorization: Bearer ${jwt}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/${installation_id}/access_tokens" | jq -er '.token')
          echo "::add-mask::${app_token}"
          jq -n --arg version "$VERSION" --arg tag "v$VERSION" --arg dist_tag "$DIST_TAG" \
            '{event_type: "provider_sdk_released", client_payload: {version: $version, tag: $tag, dist_tag: $dist_tag}}' |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${app_token}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/APIFuseHQ/apifuse/dispatches" \
            -d @-
          echo "Dispatched provider_sdk_released version=$VERSION dist_tag=$DIST_TAG to APIFuseHQ/apifuse"
