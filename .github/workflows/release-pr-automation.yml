name: Release PR Automation

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "bin/**"
      - "scripts/**"
      - "README.md"
      - "AUTHORING.md"
      - "CHANGELOG.md"
      - "SUBMISSION.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-guard.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-pr-automation.yml"

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  DOPPLER_PROJECT: apifuse
  DOPPLER_CONFIG: prd

concurrency:
  group: provider-sdk-beta-release-pr
  cancel-in-progress: false

jobs:
  prepare-beta-release-pr:
    name: Prepare beta release PR
    if: >-
      github.repository == 'APIFuseHQ/provider-sdk' &&
      !contains(github.event.head_commit.message, 'release/beta-') &&
      !startsWith(github.event.head_commit.message, 'chore: release @apifuse/provider-sdk')
    runs-on: ubuntu-latest
    steps:
      # `github.token` cannot open the release PR: the org disallows GitHub
      # Actions from creating pull requests, so `gh pr create` fails with
      # "GitHub Actions is not permitted to create or approve pull requests"
      # even though this workflow declares `pull-requests: write`. That switch
      # is an independent guard, not a permissions scope, and the org keeps it
      # off deliberately. A GitHub App installation token is not subject to it,
      # which is the pattern the monorepo already uses
      # (apifuse/.github/workflows/provider-sdk-auto-bump.yml).
      - name: Fetch GitHub App credentials from Doppler
        id: github_app
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "::error::DOPPLER_TOKEN GitHub secret is required to read the Doppler-managed GitHub App credentials."
            exit 1
          fi
          # Per-key reads (rule "reads are per key", apifuse wave5 R4-02): one GET
          # per secret NAME; the whole config is never downloaded into the job.
          # Byte-for-byte the monorepo's canonical inline reader
          # (apifuse/.github/workflows/gitops-write.yml, provider-sdk-auto-bump.yml)
          # minus its monorepo-only rollback hint. Measured Doppler contract
          # (2026-09-12): an absent NAME is HTTP 200 with null raw/computed, which
          # yields an empty value and trips the non-empty guard below; any non-2xx
          # (404 config/project not found, 400 "does not have access" from a
          # config-scoped service token, 401/403, 5xx) means the STORE is unreadable
          # and fails here naming the config — never "key absent". The one-time
          # preflight also refuses a branch config (root=false inherits every root
          # secret, so a split config would be a silent no-op).
          doppler_get() {
            local response
            response="$(curl -sS --max-time 20 -w $'\n%{http_code}' -H "Authorization: Bearer ${DOPPLER_TOKEN}" -H "Accept: application/json" "$1")" || response=$'\n000'
            DOPPLER_HTTP_CODE="${response##*$'\n'}"
            DOPPLER_HTTP_BODY="${response%$'\n'*}"
          }
          doppler_config_preflight() {
            doppler_get "https://api.doppler.com/v3/configs/config?project=${DOPPLER_PROJECT}&config=${DOPPLER_CONFIG}"
            if [ "${DOPPLER_HTTP_CODE}" != "200" ]; then
              echo "::error::Doppler config ${DOPPLER_PROJECT}/${DOPPLER_CONFIG} is not readable with this token (HTTP ${DOPPLER_HTTP_CODE}); check the DOPPLER_TOKEN service token access." >&2
              return 1
            fi
            if [ "$(printf '%s' "${DOPPLER_HTTP_BODY}" | jq -r '.config.root')" != "true" ]; then
              echo "::error::Doppler config ${DOPPLER_PROJECT}/${DOPPLER_CONFIG} is a branch config (root=false); it inherits every root secret, so the split would be a silent no-op. Use a root config in its own environment." >&2
              return 1
            fi
          }
          read_secret() {
            doppler_get "https://api.doppler.com/v3/configs/config/secret?project=${DOPPLER_PROJECT}&config=${DOPPLER_CONFIG}&name=$1"
            if [ "${DOPPLER_HTTP_CODE}" != "200" ]; then
              echo "::error::Doppler read of $1 from ${DOPPLER_PROJECT}/${DOPPLER_CONFIG} failed (HTTP ${DOPPLER_HTTP_CODE}); an absent key would be HTTP 200 with a null value, so this is an unreadable store, not a missing key." >&2
              return 1
            fi
            printf '%s' "${DOPPLER_HTTP_BODY}" | jq -r '.value.computed // .value.raw // empty'
          }
          doppler_config_preflight
          app_id=$(read_secret APIFUSE__BOUNTY__GITHUB_APP_ID)
          private_key=$(read_secret APIFUSE__BOUNTY__GITHUB_APP_PRIVATE_KEY)
          if [ -z "${app_id}" ] || [ -z "${private_key}" ]; then
            echo "::error::APIFUSE__BOUNTY__GITHUB_APP_ID and APIFUSE__BOUNTY__GITHUB_APP_PRIVATE_KEY are required in Doppler ${DOPPLER_PROJECT}/${DOPPLER_CONFIG}."
            exit 1
          fi
          # Line-oriented ::add-mask:: leaks all but the first line of a
          # multiline value into the log; mask the key line by line.
          while IFS= read -r mask_line; do
            [ -n "${mask_line}" ] && echo "::add-mask::${mask_line}"
          done <<<"${private_key}"
          delimiter="github-app-private-key-${RANDOM}-${RANDOM}"
          {
            echo "app_id=${app_id}"
            echo "private_key<<${delimiter}"
            echo "${private_key}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.github_app.outputs.app_id }}
          private-key: ${{ steps.github_app.outputs.private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: "npm"
          cache-dependency-path: bun.lock
      - run: bun install --frozen-lockfile
      - name: Create or update beta release PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: bun scripts/prepare-beta-release-pr.ts
