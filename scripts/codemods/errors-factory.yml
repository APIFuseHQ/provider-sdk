---
# Residue, not a rewrite: an errorCodes element that is neither a row literal
# nor a spread, so rule 2 cannot turn it into a reference and leaves the list
# whole. `apifuse migrate` (errors-hoist) resolves a row referenced by name
# across files; anything else stays for the author.
id: errors-factory-entry-not-a-row
language: typescript
severity: warning
message: 'errorCodes element is not a row literal or a spread; the list is left whole so the declared code is not dropped.'
note: 'Run `apifuse migrate` (errors-hoist resolves a row constant by name, also from another file), or write the row inline, or list errors.CODE from the defineErrors map.'
rule:
  any:
    - kind: identifier
    - kind: member_expression
    - kind: subscript_expression
    - kind: call_expression
    - kind: ternary_expression
    - kind: as_expression
    - kind: parenthesized_expression
  inside:
    kind: array
    inside:
      kind: pair
      has:
        field: key
        regex: '^errorCodes$'
