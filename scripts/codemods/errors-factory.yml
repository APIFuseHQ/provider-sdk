# errors-factory: migrate the pre-defineErrors error path to the factory.
#
# Preview (read-only):   ast-grep scan --rule scripts/codemods/errors-factory.yml <provider-dir>
# Apply:                 ast-grep scan --rule scripts/codemods/errors-factory.yml --update-all <provider-dir>
# Then: add `import { defineErrors, sdkErrors } from "@apifuse/provider-sdk/provider"` where a
# table became a defineErrors map, import that map where a throw site or operation uses it,
# run `biome format`, and let `tsc` name what the codemod cannot know:
#   - a provider-owned code's `category` (the old table never stated one; only a 409/410/422
#     status implies `upstream_rejected`, which is filled in);
#   - a legacy `...SPREAD` of category/retryable constants left inside a factory call
#     (ignored at serve time; delete it);
#   - a table row keyed under an SDK-registered name whose `status` or `retryable` differs from
#     the registry is NOT rewritten to `sdkErrors.X`: it keeps its own values under that key (which
#     `defineErrors` refuses, so it cannot ship silently) and rule 4 reports it. Two choices: accept
#     the SDK value (replace the row with `X: sdkErrors.X`) or declare a distinct provider code for
#     that condition (`UPSTREAM_REJECTED: sdkErrors.UPSTREAM_REJECTED` for a deterministic 4xx
#     refusal, or a provider code with its own status/retryable) and throw it at those sites;
#   - rows written inline in an operation's `errorCodes` that carry `status` or `description`
#     are NOT rewritten here (an `errors.X` reference could not carry them): `apifuse migrate`
#     runs the `errors-hoist` step before this file, which moves them into the provider's one
#     defineErrors map (domain/errors.ts, or the existing `export const errors`) and lists the
#     references, so this file meets only tables and reference lists. Run standalone, rule 5
#     reports each such row and rule 2 leaves the list whole;
#   - a throw site whose `code` is not a string literal (`code: flag ? "A" : "B"`) is left as is.
#
# Rules, in order:
#   1. throw-site          new ProviderError(msg, { code: "X", ...rest })  -> errors.X({ message: msg, ...rest })
#                          (per-throw category/retryable are dropped: the declaration owns them;
#                          a code that is not an identifier, e.g. "429", is reached as errors["429"];
#                          a registered code whose per-throw value contradicts the registry is NOT
#                          rewritten: rule 6 reports it)
#   2. operation-list      errorCodes: [ { code: "X" }, ...TABLE ]          -> errors: [ errors.X, ...Object.values(TABLE) ]
#                          (skipped while any row of the list carries status or description: rule 5,
#                          or any element is neither a row literal nor a spread: rule 7)
#   3. declaration-table   const T = [ { code: "X", status, description, retryable }, ... ] as const
#                          (only a table whose own rows carry both code and status as their own keys;
#                          a lookup table of { code, name } rows, or a test-case array whose rows nest
#                          an { code, status } object, is not an error table and is left alone;
#                          `apifuse migrate` never scans __tests__/** or *.test.ts)
#                          -> const T = defineErrors({ X: sdkErrors.X | { status, description, retryable, category? } })
#                          (a registered code becomes `sdkErrors.X` only when the row's status and
#                          retryable equal the registry's; otherwise the row keeps its values)
#   4. sdk-row-conflict    diagnostic only (no fix): a registered-code row of a table whose status or
#                          retryable differs from the registry, with the two choices (an inline
#                          errorCodes row is the errors-hoist step's, which reports it itself)
#   5. inline-row-hoist    diagnostic only (no fix): an errorCodes row written inline with status or
#                          description; `apifuse migrate` moves it (errors-hoist) and drops this
#                          diagnostic when both run
#   6. throw-site-registry-conflict  diagnostic only (no fix): a throw site of a registered code whose
#                          per-throw retryable or category contradicts the registry; rule 1 skips it
#   7. entry-not-a-row     diagnostic only (no fix): an errorCodes element that is not a row literal
#                          or a spread (a row constant referenced by name); rule 2 skips the list and
#                          `apifuse migrate` (errors-hoist) resolves the name across files
id: errors-factory-throw-site
language: typescript
utils:
  # The options object of a throw whose per-throw retryable or category
  # contradicts the SDK registry for a registered code: rewriting it would
  # drop the option and flip what the site serves (rule 6 reports it).
  registry-conflict-options:
    kind: object
    any:
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](NOT_FOUND|not_found|NO_DATA)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_http[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](RATE_LIMITED|UPSTREAM_RATE_LIMIT|LIMITED_NUMBER_OF_SERVICE_REQUESTS_EXCEEDS_ERROR)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^true$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_rate_limited[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](UPSTREAM_REJECTED)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_rejected[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](UPSTREAM_ERROR)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^true$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_http[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](BLOCKED)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']anti_bot_blocked[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](UPSTREAM_SCHEMA_ERROR)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_schema_drift[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](UPSTREAM_AUTH_ERROR)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_auth[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](INVALID_REQUEST)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']input_validation[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](AUTH_REQUIRED)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']credential_unavailable[\"']$" } }
rule:
  pattern: new ProviderError($MSG, { $$$PROPS })
  all:
    - has:
        pattern:
          context: '{ code: $CODE }'
          selector: pair
        stopBy: end
    - not:
        has:
          matches: registry-conflict-options
          stopBy: end
constraints:
  CODE:
    kind: string
    regex: "^[\"'][A-Za-z_$][A-Za-z0-9_$]*[\"']$"
rewriters:
  - id: keep-throw-props
    rule:
      pattern: $PROP
      any:
        - kind: pair
          not:
            any:
              - pattern:
                  context: '{ code: $_ }'
                  selector: pair
              - pattern:
                  context: '{ category: $_ }'
                  selector: pair
              - pattern:
                  context: '{ retryable: $_ }'
                  selector: pair
        - kind: spread_element
        - kind: shorthand_property_identifier
    fix: $PROP
transform:
  CODE_NAME:
    substring:
      source: $CODE
      startChar: 1
      endChar: -1
  REST:
    rewrite:
      source: $$$PROPS
      rewriters: [keep-throw-props]
      joinBy: ', '
  INPUT:
    replace:
      source: $REST
      replace: '(?s)^(.+)$'
      by: ', $1'
fix: 'errors.$CODE_NAME({ message: $MSG$INPUT })'
---
