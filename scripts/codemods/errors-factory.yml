---
id: errors-factory-operation-list
language: typescript
rule:
  any:
    - pattern:
        context: '{ errorCodes: [ $$$ENTRIES ] }'
        selector: pair
    - pattern:
        context: '{ errorCodes: [ $$$ENTRIES ] as const }'
        selector: pair
  all:
    # A row that still carries its contract inline cannot become a reference;
    # the list waits until errors-hoist moves it (rule 5 names the row).
    - not:
        has:
          kind: object
          has:
            kind: pair
            has:
              field: key
              regex: '^(status|description)$'
          stopBy: end
    # An operation that already lists `errors` (errors-hoist left a residue
    # row or a non-table spread in errorCodes) must not get a second key.
    - not:
        inside:
          kind: object
          has:
            kind: pair
            has:
              field: key
              regex: '^errors$'
    # An element that is neither a row literal nor a spread (a row referenced
    # by name, a call) has no rewriter; dropping it would empty the list.
    # errors-hoist resolves a named row across files; rule 7 reports the rest.
    - not:
        has:
          kind: array
          stopBy: end
          has:
            any:
              - kind: identifier
              - kind: member_expression
              - kind: subscript_expression
              - kind: call_expression
              - kind: ternary_expression
              - kind: as_expression
              - kind: parenthesized_expression
rewriters:
  - id: entry-to-factory
    rule:
      kind: object
      has:
        pattern:
          context: '{ code: $CODE }'
          selector: pair
    constraints:
      CODE:
        kind: string
        regex: "^[\"'][A-Za-z_$][A-Za-z0-9_$]*[\"']$"
    transform:
      CODE_NAME:
        substring:
          source: $CODE
          startChar: 1
          endChar: -1
    fix: errors.$CODE_NAME
  - id: entry-to-factory-bracket
    rule:
      kind: object
      has:
        pattern:
          context: '{ code: $CODE }'
          selector: pair
    constraints:
      CODE:
        kind: string
        regex: "^[\"'](.*[^A-Za-z0-9_$].*|[0-9].*)[\"']$"
    fix: errors[$CODE]
  - id: spread-to-factories
    rule:
      pattern:
        context: '[...$TABLE]'
        selector: spread_element
    fix: '...Object.values($TABLE)'
transform:
  FACTORIES:
    rewrite:
      source: $$$ENTRIES
      rewriters: [entry-to-factory, entry-to-factory-bracket, spread-to-factories]
      joinBy: ', '
fix: 'errors: [$FACTORIES]'
---
id: errors-factory-declaration-table
language: typescript
rule:
  any:
    - pattern: const $NAME = [ $$$ENTRIES ] as const
    - pattern: const $NAME = [ $$$ENTRIES ]
    - pattern: 'const $NAME: $TYPE = [ $$$ENTRIES ]'
  # A row is a direct element of the declared array whose own keys include
  # code and status; a nested object with those keys (a test case's
  # `expected: { code, status }`) is not a row, and the file is not a table.
  has:
    kind: object
    stopBy: end
    inside:
      kind: array
      inside:
        any:
          - kind: variable_declarator
          - kind: as_expression
            inside: { kind: variable_declarator }
    all:
      - has:
          kind: pair
          has: { field: key, regex: '^code$' }
      - has:
          kind: pair
          has: { field: key, regex: '^status$' }
rewriters:
  - id: keep-row-fields
    rule:
      kind: pair
      pattern: $FIELD
      not:
        pattern:
          context: '{ code: $_ }'
          selector: pair
    fix: $FIELD
  # One sdk-row rewriter per (status, retryable) group of the SDK registry
  # (src/error-resolution.ts SDK_ERROR_REGISTRY). A row is rewritten to the
  # reference only when every status/retryable it states equals the registry's;
  # a differing row falls through to rejection-row/provider-row, keeps its
  # values under the registered key, and the sdk-row-conflict rule reports it.
  - id: sdk-row-404-non-retryable
    rule:
      kind: object
      all:
        - has:
            pattern:
              context: '{ code: $CODE }'
              selector: pair
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^status$' }
                - not: { has: { field: value, regex: '^404$' } }
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^retryable$' }
                - not: { has: { field: value, regex: '^false$' } }
    constraints:
      CODE:
        regex: "^[\"'](NOT_FOUND|not_found|NO_DATA)[\"']$"
    transform:
      CODE_NAME:
        substring:
          source: $CODE
          startChar: 1
          endChar: -1
    fix: '$CODE_NAME: sdkErrors.$CODE_NAME'
  - id: sdk-row-429-retryable
    rule:
      kind: object
      all:
        - has:
            pattern:
              context: '{ code: $CODE }'
              selector: pair
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^status$' }
                - not: { has: { field: value, regex: '^429$' } }
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^retryable$' }
                - not: { has: { field: value, regex: '^true$' } }
    constraints:
      CODE:
        regex: "^[\"'](RATE_LIMITED|UPSTREAM_RATE_LIMIT|LIMITED_NUMBER_OF_SERVICE_REQUESTS_EXCEEDS_ERROR)[\"']$"
    transform:
      CODE_NAME:
        substring:
          source: $CODE
          startChar: 1
          endChar: -1
    fix: '$CODE_NAME: sdkErrors.$CODE_NAME'
  - id: sdk-row-409-non-retryable
    rule:
      kind: object
      all:
        - has:
            pattern:
              context: '{ code: $CODE }'
              selector: pair
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^status$' }
                - not: { has: { field: value, regex: '^409$' } }
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^retryable$' }
                - not: { has: { field: value, regex: '^false$' } }
    constraints:
      CODE:
        regex: "^[\"']UPSTREAM_REJECTED[\"']$"
    transform:
      CODE_NAME:
        substring:
          source: $CODE
          startChar: 1
          endChar: -1
    fix: '$CODE_NAME: sdkErrors.$CODE_NAME'
  - id: sdk-row-502-retryable
    rule:
      kind: object
      all:
        - has:
            pattern:
              context: '{ code: $CODE }'
              selector: pair
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^status$' }
                - not: { has: { field: value, regex: '^502$' } }
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^retryable$' }
                - not: { has: { field: value, regex: '^true$' } }
    constraints:
      CODE:
        regex: "^[\"']UPSTREAM_ERROR[\"']$"
    transform:
      CODE_NAME:
        substring:
          source: $CODE
          startChar: 1
          endChar: -1
    fix: '$CODE_NAME: sdkErrors.$CODE_NAME'
  - id: sdk-row-502-non-retryable
    rule:
      kind: object
      all:
        - has:
            pattern:
              context: '{ code: $CODE }'
              selector: pair
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^status$' }
                - not: { has: { field: value, regex: '^502$' } }
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^retryable$' }
                - not: { has: { field: value, regex: '^false$' } }
    constraints:
      CODE:
        regex: "^[\"'](BLOCKED|UPSTREAM_SCHEMA_ERROR)[\"']$"
    transform:
      CODE_NAME:
        substring:
          source: $CODE
          startChar: 1
          endChar: -1
    fix: '$CODE_NAME: sdkErrors.$CODE_NAME'
  - id: sdk-row-400-non-retryable
    rule:
      kind: object
      all:
        - has:
            pattern:
              context: '{ code: $CODE }'
              selector: pair
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^status$' }
                - not: { has: { field: value, regex: '^400$' } }
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^retryable$' }
                - not: { has: { field: value, regex: '^false$' } }
    constraints:
      CODE:
        regex: "^[\"'](UPSTREAM_AUTH_ERROR|INVALID_REQUEST)[\"']$"
    transform:
      CODE_NAME:
        substring:
          source: $CODE
          startChar: 1
          endChar: -1
    fix: '$CODE_NAME: sdkErrors.$CODE_NAME'
  - id: sdk-row-401-non-retryable
    rule:
      kind: object
      all:
        - has:
            pattern:
              context: '{ code: $CODE }'
              selector: pair
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^status$' }
                - not: { has: { field: value, regex: '^401$' } }
        - not:
            has:
              kind: pair
              all:
                - has: { field: key, regex: '^retryable$' }
                - not: { has: { field: value, regex: '^false$' } }
    constraints:
      CODE:
        regex: "^[\"']AUTH_REQUIRED[\"']$"
    transform:
      CODE_NAME:
        substring:
          source: $CODE
          startChar: 1
          endChar: -1
    fix: '$CODE_NAME: sdkErrors.$CODE_NAME'
  - id: rejection-row
    rule:
      pattern:
        context: 'const _ = { $$$FIELDS }'
        selector: object
      all:
        - has:
            pattern:
              context: '{ code: $CODE }'
              selector: pair
        - has:
            pattern:
              context: '{ status: $STATUS }'
              selector: pair
    constraints:
      CODE:
        kind: string
      STATUS:
        regex: '^(409|410|422)$'
    transform:
      CODE_NAME:
        substring:
          source: $CODE
          startChar: 1
          endChar: -1
      REST:
        rewrite:
          source: $$$FIELDS
          rewriters: [keep-row-fields]
          joinBy: ', '
    fix: '$CODE: { category: "upstream_rejected", $REST }'
  - id: provider-row
    rule:
      pattern:
        context: 'const _ = { $$$FIELDS }'
        selector: object
      has:
        pattern:
          context: '{ code: $CODE }'
          selector: pair
    constraints:
      CODE:
        kind: string
    transform:
      CODE_NAME:
        substring:
          source: $CODE
          startChar: 1
          endChar: -1
      REST:
        rewrite:
          source: $$$FIELDS
          rewriters: [keep-row-fields]
          joinBy: ', '
    fix: '$CODE: { $REST }'
  - id: table-spread
    rule:
      kind: spread_element
      pattern: $SPREAD
    fix: $SPREAD
transform:
  ROWS:
    rewrite:
      source: $$$ENTRIES
      rewriters:
        - sdk-row-404-non-retryable
        - sdk-row-429-retryable
        - sdk-row-409-non-retryable
        - sdk-row-502-retryable
        - sdk-row-502-non-retryable
        - sdk-row-400-non-retryable
        - sdk-row-401-non-retryable
        - rejection-row
        - provider-row
        - table-spread
      joinBy: ', '
fix: 'const $NAME = defineErrors({ $ROWS })'
---
# Residue, not a rewrite: a table row keyed under an SDK-registered code whose
# status or retryable differs from the registry. The row keeps its own values
# (rule 3 leaves it a provider-row under the registered key, which defineErrors
# refuses at the type and at runtime), so the provider's contract is not
# flipped by the migration; the author chooses. An inline errorCodes row is
# not a table row: the errors-hoist step owns it and reports the same choice.
id: errors-factory-sdk-row-conflict
language: typescript
severity: warning
message: 'Row $CODE states a status or retryable that differs from the SDK registry (sdkErrors.$CODE_NAME); it is left with its own values, which defineErrors refuses under a registered key.'
note: 'Two choices: (a) accept the SDK value and replace the row with `X: sdkErrors.X`; or (b) declare a distinct provider code for this condition (a deterministic refusal is `UPSTREAM_REJECTED: sdkErrors.UPSTREAM_REJECTED`, 409 non-retryable; otherwise a provider code with its own status, category and retryable) and throw it at the sites that meant this row.'
rule:
  kind: object
  inside:
    kind: array
    not:
      inside:
        kind: pair
        has:
          field: key
          regex: '^errorCodes$'
        stopBy: end
  all:
    - has:
        pattern:
          context: '{ code: $CODE }'
          selector: pair
    - any:
        - all:
            - has:
                kind: pair
                all:
                  - has: { field: key, regex: '^code$' }
                  - has: { field: value, regex: "^[\"'](NOT_FOUND|not_found|NO_DATA)[\"']$" }
            - any:
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^status$' }
                      - not: { has: { field: value, regex: '^404$' } }
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^retryable$' }
                      - not: { has: { field: value, regex: '^false$' } }
        - all:
            - has:
                kind: pair
                all:
                  - has: { field: key, regex: '^code$' }
                  - has: { field: value, regex: "^[\"'](RATE_LIMITED|UPSTREAM_RATE_LIMIT|LIMITED_NUMBER_OF_SERVICE_REQUESTS_EXCEEDS_ERROR)[\"']$" }
            - any:
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^status$' }
                      - not: { has: { field: value, regex: '^429$' } }
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^retryable$' }
                      - not: { has: { field: value, regex: '^true$' } }
        - all:
            - has:
                kind: pair
                all:
                  - has: { field: key, regex: '^code$' }
                  - has: { field: value, regex: "^[\"']UPSTREAM_REJECTED[\"']$" }
            - any:
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^status$' }
                      - not: { has: { field: value, regex: '^409$' } }
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^retryable$' }
                      - not: { has: { field: value, regex: '^false$' } }
        - all:
            - has:
                kind: pair
                all:
                  - has: { field: key, regex: '^code$' }
                  - has: { field: value, regex: "^[\"']UPSTREAM_ERROR[\"']$" }
            - any:
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^status$' }
                      - not: { has: { field: value, regex: '^502$' } }
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^retryable$' }
                      - not: { has: { field: value, regex: '^true$' } }
        - all:
            - has:
                kind: pair
                all:
                  - has: { field: key, regex: '^code$' }
                  - has: { field: value, regex: "^[\"'](BLOCKED|UPSTREAM_SCHEMA_ERROR)[\"']$" }
            - any:
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^status$' }
                      - not: { has: { field: value, regex: '^502$' } }
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^retryable$' }
                      - not: { has: { field: value, regex: '^false$' } }
        - all:
            - has:
                kind: pair
                all:
                  - has: { field: key, regex: '^code$' }
                  - has: { field: value, regex: "^[\"'](UPSTREAM_AUTH_ERROR|INVALID_REQUEST)[\"']$" }
            - any:
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^status$' }
                      - not: { has: { field: value, regex: '^400$' } }
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^retryable$' }
                      - not: { has: { field: value, regex: '^false$' } }
        - all:
            - has:
                kind: pair
                all:
                  - has: { field: key, regex: '^code$' }
                  - has: { field: value, regex: "^[\"']AUTH_REQUIRED[\"']$" }
            - any:
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^status$' }
                      - not: { has: { field: value, regex: '^401$' } }
                - has:
                    kind: pair
                    all:
                      - has: { field: key, regex: '^retryable$' }
                      - not: { has: { field: value, regex: '^false$' } }
constraints:
  CODE:
    regex: "^[\"'](NOT_FOUND|not_found|NO_DATA|RATE_LIMITED|UPSTREAM_RATE_LIMIT|LIMITED_NUMBER_OF_SERVICE_REQUESTS_EXCEEDS_ERROR|UPSTREAM_REJECTED|UPSTREAM_ERROR|BLOCKED|UPSTREAM_AUTH_ERROR|UPSTREAM_SCHEMA_ERROR|AUTH_REQUIRED|INVALID_REQUEST)[\"']$"
transform:
  CODE_NAME:
    substring:
      source: $CODE
      startChar: 1
      endChar: -1
---
# Residue, not a rewrite: an errorCodes row written inline with its contract.
# A reference cannot carry status or description, so rule 2 leaves the whole
# list alone until the row lives in a map. `apifuse migrate` runs the
# errors-hoist step first, which moves the row and reports the ones it cannot;
# this diagnostic is for a standalone run of this file.
id: errors-factory-inline-row-hoist
language: typescript
severity: warning
message: 'Inline errorCodes row $CODE carries status or description that an errors.$CODE_NAME reference cannot; it is left in place.'
note: 'Run `apifuse migrate` (its errors-hoist step moves the row into the defineErrors map and lists errors.$CODE_NAME here), or hoist the row into a `const T = [ ... ] as const` table spread in this list and re-run this file.'
rule:
  kind: object
  inside:
    kind: array
    inside:
      kind: pair
      has:
        field: key
        regex: '^errorCodes$'
      stopBy: end
  all:
    - has:
        pattern:
          context: '{ code: $CODE }'
          selector: pair
    - has:
        kind: pair
        has:
          field: key
          regex: '^(status|description)$'
constraints:
  CODE:
    kind: string
transform:
  CODE_NAME:
    substring:
      source: $CODE
      startChar: 1
      endChar: -1
---
# Residue, not a rewrite: a throw site of a registered code whose per-throw
# retryable or category contradicts the SDK registry. Rule 1 leaves the site
# as it is (the legacy options keep winning one more release), because the
# factory form carries no per-throw option and would serve the registry's
# value; the author chooses.
id: errors-factory-throw-site-registry-conflict
language: typescript
severity: warning
message: 'Throw site of $CODE states a retryable or category that differs from the SDK registry (sdkErrors.$CODE_NAME); errors.$CODE_NAME(...) would serve the registry value, so the site is left as new ProviderError(...).'
note: 'Two choices: (a) accept the registry value: delete the per-throw retryable/category and re-run apifuse migrate; or (b) declare a distinct provider code for this condition in the defineErrors map (its own status, category and retryable) and throw that factory here.'
utils:
  # The options object of a throw whose per-throw retryable or category
  # contradicts the SDK registry for a registered code: rewriting it would
  # drop the option and flip what the site serves (rule 6 reports it).
  registry-conflict-options:
    kind: object
    any:
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](NOT_FOUND|not_found|NO_DATA)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_http[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](RATE_LIMITED|UPSTREAM_RATE_LIMIT|LIMITED_NUMBER_OF_SERVICE_REQUESTS_EXCEEDS_ERROR)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^true$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_rate_limited[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](UPSTREAM_REJECTED)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_rejected[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](UPSTREAM_ERROR)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^true$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_http[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](BLOCKED)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']anti_bot_blocked[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](UPSTREAM_SCHEMA_ERROR)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_schema_drift[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](UPSTREAM_AUTH_ERROR)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']upstream_auth[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](INVALID_REQUEST)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']input_validation[\"']$" } }
      - all:
          - has:
              kind: pair
              all:
                - has: { field: key, regex: '^code$' }
                - has: { field: value, regex: "^[\"'](AUTH_REQUIRED)[\"']$" }
          - any:
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^retryable$' }
                    - not: { has: { field: value, regex: '^false$' } }
              - has:
                  kind: pair
                  all:
                    - has: { field: key, regex: '^category$' }
                    - not: { has: { field: value, regex: "^[\"']credential_unavailable[\"']$" } }
rule:
  pattern: new ProviderError($MSG, { $$$PROPS })
  all:
    - has:
